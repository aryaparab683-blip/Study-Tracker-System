{% extends "base.html" %}
{% block title %}Edit session · Study Tracker{% endblock %}
{% block content %}
<div class="panel page-panel">
    <h2>Edit Session</h2>
    <form method="post" class="form-grid small-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div class="field">
            <label for="f-title">Title</label>
            <input type="text" id="f-title" name="title" maxlength="120" value="{{ session.title }}" required />
        </div>
        <div class="field">
            <label for="f-duration">Duration (minutes)</label>
            <input type="number" id="f-duration" name="duration" value="{{ session.duration }}" min="1" max="1440"
                required />
        </div>
        <div class="field">
            <label for="f-date">Date studied</label>
            <input type="date" id="f-date" name="date" max="{{ today }}"
                value="{{ (session.created_at|local).strftime('%Y-%m-%d') }}" />
        </div>
        <div class="field">
            <label for="f-subject">Subject</label>
            <select id="f-subject" name="subject_id">
                <option value="">No subject</option>
                {% for subject in subjects %}
                <option value="{{ subject.id }}" {% if session.subject_id == subject.id %}selected{% endif %}>{{ subject.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="field full">
            <label for="f-notes">Notes</label>
            <textarea id="f-notes" name="notes" rows="4" maxlength="5000">{{ session.notes or '' }}</textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="primary">Save changes</button>
            <a href="{{ url_for('main.sessions') }}" class="secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
